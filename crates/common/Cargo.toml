[package]
name = "heimdall-common"
description = "Commonly used resources for heimdall modules."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
exclude.workspace = true

[lib]
bench = false

[lints]
workspace = true

[features]
default = []
# Every path that talks to the network: RPC providers and transports, Etherscan, the openchain
# signature database, OpenRouter, Transpose and the GitHub version check. Off by default, so a
# library build has no HTTP client at all; the CLI turns it on.
network = [
    "dep:async-openai",
    "dep:reqwest",
    "dep:backoff",
    "dep:tokio-retry",
    "alloy/default",
    "alloy/full",
    "alloy/rpc-types-debug",
    "alloy/rpc-types-trace",
]

[dependencies]
async-openai = { workspace = true, optional = true }
clap = { workspace = true, features = ["derive"] }
colored.workspace = true
crossbeam-channel.workspace = true
fancy-regex.workspace = true
heimdall-cache = { workspace = true }
indicatif.workspace = true
lazy_static.workspace = true
rand.workspace = true
reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
strsim.workspace = true
async-recursion.workspace = true
async-trait.workspace = true
chrono.workspace = true
backoff = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true
eyre.workspace = true
alloy-json-abi = { workspace = true, features = ["serde_json"] }
futures.workspace = true
alloy.workspace = true
bytes = { workspace = true }
alloy-dyn-abi.workspace = true
tokio-retry = { workspace = true, optional = true }
hashbrown.workspace = true
